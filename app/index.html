<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2440">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tramvaji">
<title>Tramvaji – red vožnje</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="modebar">
  <nav id="modes" class="modes">
    <button data-mode="live">Uživo</button>
    <button data-mode="st">Stanica</button>
    <button data-mode="tt">Red vožnje</button>
  </nav>
  <button id="mapBtn" class="iconbtn" aria-label="Karta vozila uživo">🗺️</button>
  <button id="newsBtn" class="iconbtn hidden" aria-label="Obavijesti ZET-a">📢<span id="newsCount" class="count hidden"></span></button>
</div>
<header class="top">
  <nav id="tabs" class="tabs"></nav>
  <button id="editBtn" class="iconbtn" aria-label="Uredi">✎</button>
</header>

<main>
  <section id="liveBoard" class="board">
    <div class="board-head">
      <span class="brand">🚋 ZET</span>
      <span class="cap">MINUTA DO POLASKA</span>
    </div>
    <div id="rows"></div>
  </section>
  <p id="status" class="status"></p>

  <!-- Svi polasci s jedne stanice (sljedeća 2 sata) -->
  <section id="st" class="hidden">
    <div id="stHead" class="board st-head"></div>
    <div id="stList" class="board st-list hidden"></div>
    <p id="stNote" class="status"></p>
  </section>

  <!-- Red vožnje za odabrani dan -->
  <section id="tt" class="tt hidden">
    <div id="ttHead" class="tt-sticky hidden"></div>
    <div id="ttSel" class="board tt-sel"></div>
    <div id="ttDateBar" class="tt-date hidden">
      <button class="iconbtn" data-tt="prev" aria-label="Prethodni dan">◀</button>
      <button class="tt-day" data-tt="cal"><span id="ttDay"></span><small>dodirni za kalendar</small></button>
      <button class="iconbtn" data-tt="next" aria-label="Sljedeći dan">▶</button>
    </div>
    <div id="ttList"></div>
  </section>
</main>

<!-- Traka s obavijestima ZET-a -->
<div id="banner" class="banner hidden" role="button" tabindex="0">
  <span class="b-ico">⚠</span>
  <span class="b-txt"><span id="bTitle" class="b-title"></span><span id="bMore" class="b-more"></span></span>
  <button id="bClose" class="b-close" aria-label="Sakrij">✕</button>
</div>

<!-- Uređivanje grupe -->
<div id="sheet" class="sheet hidden" role="dialog">
  <div class="sheet-card">
    <div class="sheet-head">
      <span class="spacer"></span>
      <h2 id="sheetTitle">Uredi</h2>
      <button class="done" data-close>Gotovo</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
