<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2440">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tramvaji">
<title>Tramvaji – red vožnje</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <nav id="tabs" class="tabs"></nav>
  <button id="editBtn" class="iconbtn" aria-label="Uredi">✎</button>
</header>

<main>
  <section id="liveBoard" class="board">
    <div class="board-head">
      <span class="brand">🚋 ZET</span>
      <span class="cap">MINUTA DO POLASKA</span>
    </div>
    <div id="rows"></div>
  </section>
  <p id="status" class="status"></p>

  <!-- Svi polasci s jedne stanice (sljedeća 2 sata) -->
  <section id="st" class="hidden">
    <div id="stHead" class="board st-head"></div>
    <div id="stList" class="board st-list hidden"></div>
    <p id="stNote" class="status"></p>
  </section>

  <!-- Red vožnje za odabrani dan -->
  <section id="tt" class="tt hidden">
    <div id="ttHead" class="tt-sticky hidden"></div>
    <div id="ttSel" class="board tt-sel"></div>
    <div id="ttDateBar" class="tt-date hidden">
      <button class="iconbtn" data-tt="prev" aria-label="Prethodni dan">◀</button>
      <button class="tt-day" data-tt="cal"><span id="ttDay"></span><small>dodirni za kalendar</small></button>
      <button class="iconbtn" data-tt="next" aria-label="Sljedeći dan">▶</button>
    </div>
    <div id="ttList"></div>
  </section>
</main>

<!-- Traka s obavijestima ZET-a -->
<div id="banner" class="banner hidden" role="button" tabindex="0">
  <span class="b-ico">⚠</span>
  <span class="b-txt"><span id="bTitle" class="b-title"></span><span id="bMore" class="b-more"></span></span>
  <button id="bClose" class="b-close" aria-label="Sakrij">✕</button>
</div>

<!-- Uređivanje grupe -->
<div id="sheet" class="sheet hidden" role="dialog">
  <div class="sheet-card">
    <div class="sheet-head">
      <span class="spacer"></span>
      <h2 id="sheetTitle">Uredi</h2>
      <button class="done" data-close>Gotovo</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>

<nav id="modes" class="tabbar" aria-label="Izbornik">
  <button data-mode="live"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg><span>Uživo</span></button>
  <button data-mode="st"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="10" r="2.3"/></svg><span>Stanica</span></button>
  <button data-mode="tt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Red vožnje</span></button>
  <button id="mapBtn" aria-label="Karta vozila uživo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6 9 4z"/><path d="M9 4v14M15 6v14"/></svg><span>Karta</span></button>
  <button id="newsBtn" aria-label="Obavijesti ZET-a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8.5-3 8.5h18S18 15 18 8z"/><path d="M10.3 20a1.9 1.9 0 0 0 3.4 0"/></svg><span>Obavijesti</span><b id="newsCount" class="count hidden"></b></button>
</nav>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
